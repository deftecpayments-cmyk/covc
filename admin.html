<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh}
.header{background:#1a1a2e;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c41e3a}
.header h1{font-size:20px;color:#fff}
.status-bar{display:flex;gap:16px;align-items:center}
.badge{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.badge.visitors{background:#1b4332;color:#52b788;border:1px solid #2d6a4f}
.badge.connected{background:#1a3a1a;color:#4ade80;border:1px solid #2d6a2d}
.badge.disconnected{background:#3a1a1a;color:#f87171;border:1px solid #6a2d2d}
.wifi-icon{width:18px;height:18px}
.wifi-icon svg{width:100%;height:100%;fill:currentColor}
.container{padding:24px}
.section{background:#1a1a2e;border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #2a2a4a}
.section h2{font-size:16px;color:#94a3b8;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;background:#0f0f23;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #2a2a4a}
td{padding:10px 12px;border-bottom:1px solid #1e1e3a;font-size:13px;color:#cbd5e1}
tr:hover{background:#16213e}
.empty{text-align:center;color:#475569;padding:40px;font-size:14px}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>
<div class="header">
  <h1>CVB Homepage Admin</h1>
  <div class="status-bar">
    <div class="badge visitors" id="visitorBadge">
      <span class="wifi-icon"><svg viewBox="0 0 24 24"><path d="M1.3 8.7a15.9 15.9 0 0 1 21.4 0l-2.1 2.1a13 13 0 0 0-17.2 0L1.3 8.7zM5.5 12.9a10.4 10.4 0 0 1 13 0l-2.1 2.1a7.5 7.5 0 0 0-8.8 0l-2.1-2.1zM9.7 17.1a4.6 4.6 0 0 1 4.6 0L12 19.8l-2.3-2.7z"/></svg></span>
      <span id="visitorCount">0</span> Active
    </div>
    <div class="badge disconnected" id="connBadge">
      <span class="pulse">●</span> <span id="connText">Connecting...</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="section">
    <h2>Submissions</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Time</th>
          <th>Data</th>
          <th>IP</th>
          <th>User Agent</th>
        </tr>
      </thead>
      <tbody id="submissionBody">
        <tr><td colspan="5" class="empty">No submissions yet</td></tr>
      </tbody>
    </table>
  </div>
</div>

<audio id="notifSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVggoqHdV5da4eMjH5pWWJ5h4mDcWBgcIKGgnVnYXSBhYF1aGZ2gIOAdGtqeYGCfnVubnyBgX14c3N9gIF8eHZ3foCAfHl4eX6Af3x6eXp9f398e3t7fH5/fXx8fHx9fn59fX19fX1+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fg==" type="audio/wav">
</audio>

<script>
const body = document.getElementById("submissionBody");
const visitorCount = document.getElementById("visitorCount");
const connBadge = document.getElementById("connBadge");
const connText = document.getElementById("connText");
const notifSound = document.getElementById("notifSound");
let rows = [];

function setConnected(c) {
  connBadge.className = "badge " + (c ? "connected" : "disconnected");
  connText.textContent = c ? "Connected" : "Reconnecting...";
}

function renderRow(e) {
  const exclude = ["id","timestamp","ip","userAgent"];
  const dataFields = Object.keys(e).filter(k => !exclude.includes(k));
  const dataStr = dataFields.map(k => `${k}: ${e[k]}`).join(", ");
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${rows.length + 1}</td><td>${new Date(e.timestamp).toLocaleString()}</td><td>${dataStr}</td><td>${e.ip || ""}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.userAgent || ""}</td>`;
  return tr;
}

function addSubmission(e) {
  if (body.querySelector(".empty")) body.innerHTML = "";
  rows.unshift(e);
  body.prepend(renderRow(e));
  try { notifSound.currentTime = 0; notifSound.play(); } catch(x){}
}

function loadAll(subs) {
  rows = [];
  body.innerHTML = "";
  if (!subs.length) { body.innerHTML = '<tr><td colspan="5" class="empty">No submissions yet</td></tr>'; return; }
  subs.forEach(e => { rows.push(e); body.appendChild(renderRow(e)); });
}

function connectSSE() {
  const es = new EventSource("/api/events");
  es.onopen = () => setConnected(true);
  es.onerror = () => { setConnected(false); es.close(); setTimeout(connectSSE, 3000); };
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === "init") { loadAll(d.submissions); visitorCount.textContent = d.activeVisitors; }
    if (d.type === "submission") addSubmission(d.entry);
    if (d.type === "visitors") visitorCount.textContent = d.activeVisitors;
  };
}

setInterval(() => {
  fetch("/api/visitors").then(r=>r.json()).then(d=>{ visitorCount.textContent = d.activeVisitors; }).catch(()=>{});
  fetch("/api/submissions").then(r=>r.json()).then(d=>{ if(d.length !== rows.length) loadAll(d); }).catch(()=>{});
}, 3000);

connectSSE();
</script>
</body>
</html>
